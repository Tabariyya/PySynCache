[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "pybind11>=2.6",
    "jsons"
]
build-backend = "setuptools.build_meta"

[project]
name = "pysyncache"
version = "1.0.5.1"
description = "High-performance distributed caching system with real-time data synchronization (Python bindings for SynCache)"
readme = "README.md"
requires-python = ">=3.7"
authors = [
    { name = "Waleed Shanaa", email = "waleed.shanaa@outlook.com" }
]

classifiers = [
    "Development Status :: 4 - Beta",

    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",

    "License :: OSI Approved :: MIT License",

    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Clustering",
    "Topic :: System :: Networking",
    "Topic :: Database",
]

dependencies = [
    "jsons>=1.6"
]

keywords = [
    "cache",
    "distributed-cache",
    "in-process-cache",
    "cache-synchronization",
    "cluster-cache",
    "high-performance",
    "low-latency",
    "syncache",
    "distributed-systems",
    "cache-coherence"
]

[project.urls]
Homepage = "https://syncache.tabariyya.com"
Repository = "https://github.com/Tabariyya/PySynCache"
Documentation = "https://syncache.tabariyya.com/#docs"
Issues = "https://github.com/Tabariyya/PySynCache/issues"
