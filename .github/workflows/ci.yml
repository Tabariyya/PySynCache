name: CI/CD

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish to PyPI even if version has not changed'
        type: boolean
        default: false

jobs:
  test:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Install git-lfs
        run: git lfs install

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Build and test
        run: |
          docker build \
            --target tester \
            --build-arg BROKER_TOKEN=${{ secrets.BROKER_TOKEN }} \
            -t pysyncache-test \
            .

      - name: Clean up
        if: always()
        run: docker rmi pysyncache-test --force

  check-version:
    name: Check version bump
    runs-on: self-hosted
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change
        id: check
        run: |
          if [ "${{ inputs.force_publish }}" = "true" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff HEAD~1 HEAD -- pyproject.toml | grep -q '^+version'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish to PyPI
    runs-on: self-hosted
    needs: [test, check-version]
    if: needs.check-version.outputs.changed == 'true'

    steps:
      - name: Install git-lfs
        run: git lfs install

      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull LFS objects
        run: git lfs pull

      - name: Build publisher image
        run: docker build -t pysyncache-publisher .

      - name: Publish to PyPI
        run: |
          docker run --rm \
            -e TWINE_USERNAME=__token__ \
            -e TWINE_PASSWORD=${{ secrets.PYPI_TOKEN }} \
            pysyncache-publisher \
            twine upload /dist/*

      - name: Clean up
        if: always()
        run: docker rmi pysyncache-publisher --force
